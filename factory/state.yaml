# Owned by the Orchestrator. Single source of truth for factory progress.
# The eight V-model stages. Status: not_started | in_progress | in_review | baselined | invalidated
# Pairs: requirements <-> acceptance, architecture <-> system_testing,
#        design <-> integration_testing, implementation <-> unit_testing
product: "<product name>"
increment: 1

input:
  concept:
    ready: false              # concept filled in and goals numbered CON-###

stages:
  # ---- left side: building (top-down)
  requirements:
    status: not_started
    baseline: null            # git commit hash
    baseline_paths: []        # literal owned paths compared on resume
    rework_cycles: 0
    human_approval: null      # H1: { decision: approved|changes|rejected, date: ..., ref: Q-### }
  architecture:
    status: not_started
    baseline: null
    baseline_paths: []
    rework_cycles: 0
  design:
    status: not_started       # aggregate; only unscoped checks can close it
    baseline: null
    baseline_paths: []
    components: {}            # ARCH-001: { status: ..., baseline: ..., baseline_paths: [...], rework_cycles: 0 }
  implementation:
    status: not_started
    baseline: null
    baseline_paths: []
    components: {}            # ARCH-001: { status: ..., baseline: ..., baseline_paths: [...], gate: pass|fail|null }

  # ---- right side: verifying (specified early, executed bottom-up)
  unit_testing:               # verifies implementation
    spec: not_started
    spec_baseline: null
    spec_baseline_paths: []
    exec: not_started
    baseline: null
    baseline_paths: []
    coverage: { line: null, branch: null }
    components: {}            # ARCH-001: { spec: ..., spec_baseline: ..., spec_baseline_paths: [...], exec: ..., baseline: ..., baseline_paths: [...], coverage: ... }
  integration_testing:        # verifies design
    spec: not_started
    spec_baseline: null
    spec_baseline_paths: []
    exec: not_started
    baseline: null
    baseline_paths: []
  system_testing:             # verifies architecture
    spec: not_started
    spec_baseline: null
    spec_baseline_paths: []
    exec: not_started
    baseline: null
    baseline_paths: []
  acceptance:                 # verifies requirements
    spec: not_started
    spec_baseline: null
    spec_baseline_paths: []
    exec: not_started
    baseline: null
    baseline_paths: []
    recommendation: null
    human_signoff: null       # H2: { decision: accepted|rejected, date: ..., notes: ... }

# Support work, outside the eight stages. Orchestrator owns these fields;
# Memory Agent owns only factory/memory.md. Events survive interruptions.
memory:
  path: factory/memory.md
  status: pending             # not_started | pending | in_progress | current | blocked
  last_source_commit: null    # provenance of reviewed sources, not a HEAD-equality freshness check
  last_work_order: null
  reviewed_events: []         # existing baseline / WO / DEF / CR / DEC references
  pending_events:
    - trigger: initial_memory_review
      sources: [factory/memory.md, README.md, factory/state.yaml, scripts/test_trace_check.py]

budgets:
  fix_iterations_per_defect: 3
  rework_cycles_per_gate: 3
  stall_limit: 5
  small_changes_before_slow_suite: 5   # fast-only changes before the next change must run the slow suite

counters:                     # last issued number per record type
  WO: 0
  Q: 0
  DEF: 0
  CR: 0
  # Artifact high-water marks. Reserve ranges and persist before dispatch.
  CON: 0
  UC: 0
  US: 0
  REQ: 0
  SCN: 0
  EXT: 0
  ARCH: 0
  IF: 0
  DES: 0
  UT: 0
  IT: 0
  ST: 0
  AT: 0
  DEC: 0

progress:
  work_orders_since_gate_progress: 0
  small_changes_since_slow_suite: 0    # reset to 0 after a passing slow suite

open:
  questions: []               # Q-###
  defects: []                 # DEF-###
  changes: []                 # CR-###

invalidated: []               # IDs awaiting rework due to a CR or defect

pending_verification: []     # { gate: ..., scope: [...], commands: [...], source_revision: ..., reason: ... }

active_work_orders: []
# Each entry is persisted BEFORE dispatch:
# { id: WO-#, agent: ..., mode: ..., scope: [...], write_files: [...],
#   reserved_ids: { DES: [first, last], DEC: [first, last] },
#   starting_files: { path: { exists: true|false, sha256: ..., index_blob: ... } },
#   starting_untracked: [...], check_phase: specify|execute,
#   coverage_sources: [...], commands: [...], started: ... }
# Keep starting content/diffs recoverable and record pre-existing human edits.
# Retain reservations across restarts; never reuse cancelled/unused IDs.
